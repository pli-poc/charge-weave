xt><text x="127" y="510.65" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" letter-spacing="0">Delivery uncertainty</text><rect x="605" y="330" width="390" height="300" rx="22" fill="#FFFFFF" stroke="#D6E1E6" stroke-width="1"/><rect x="631" y="354" width="220" height="38" rx="19" fill="#EAF1F4" stroke="none" stroke-width="1"/><text x="741.0" y="379" fill="#00B4A6" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">SERVICE DESIGN</text><text x="637" y="430" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" letter-spacing="0">Flexible access</text><text x="637" y="485.0" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" letter-spacing="0">Shared + public</text><text x="637" y="510.65" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" letter-spacing="0">Workplace + fleet</text><text x="637" y="536.3" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" letter-spacing="0">Clear priorities</text><rect x="1115" y="330" width="390" height="300" rx="22" fill="#FFFFFF" stroke="#D6E1E6" stroke-width="1"/><rect x="1141" y="354" width="220" height="38" rx="19" fill="#EAF1F4" stroke="none" stroke-width="1"/><text x="1251.0" y="379" fill="#4CD964" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">USER OUTCOME</text><text x="1147" y="430" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="28" font-weight="750" text-anchor="start" letter-spacing="0">Reliable charging</text><text x="1147" y="485.0" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" letter-spacing="0">Understandable terms</text><text x="1147" y="510.65" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" letter-spacing="0">Practical location</text><text x="1147" y="536.3" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="19" font-weight="550" text-anchor="start" letter-spacing="0">Recovery when delayed</text><line x1="485" y1="480" x2="578" y2="480" stroke="#00B4A6" stroke-width="5" stroke-linecap="round"/><path d="M568 470 L590 480 L568 490" fill="none" stroke="#00B4A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="995" y1="480" x2="1088" y2="480" stroke="#4CD964" stroke-width="5" stroke-linecap="round"/><path d="M1078 470 L1100 480 L1078 490" fill="none" stroke="#4CD964" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="710" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="middle" letter-spacing="0">Test flexibility against the customer promise—not in isolation.</text><rect x="80" y="775" width="1440" height="54" rx="15" fill="#041D30" stroke="none" stroke-width="1"/><text x="110" y="810" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" letter-spacing="0">A charge point improves access only when people can reach and use it.</text></svg>