</style><rect width="1600" height="900" fill="#F7FAFB"/><rect x="80" y="42" width="250" height="38" rx="19" fill="#EAF1F4" stroke="none" stroke-width="1"/><text x="205.0" y="67" fill="#00B4A6" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">OUTLOOK MOBILITEIT 2026</text><text x="80" y="134.0" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="42" font-weight="750" text-anchor="start" letter-spacing="0">National energy is modest in share; local power matters</text><text x="80" y="181" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="21" font-weight="450" text-anchor="start" letter-spacing="0">Observed 2025 energy and modeled 2050 flexibility are different measures.</text><line x1="80" y1="232" x2="1520" y2="232" stroke="#D6E1E6" stroke-width="2" stroke-linecap="round"/><text x="80" y="858" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="450" text-anchor="start" letter-spacing="0">Source: ElaadNL / NAL Outlook Mobiliteit • 9 June 2026</text><text x="1520" y="858" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="end" letter-spacing="1">CHARGEWEAVE INSIGHT • DRAFT</text><rect x="80" y="290" width="680" height="430" rx="22" fill="#FFFFFF" stroke="#D6E1E6" stroke-width="1"/><rect x="106" y="314" width="220" height="38" rx="19" fill="#EAF1F4" stroke="none" stroke-width="1"/><text x="216.0" y="339" fill="#00B4A6" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">ENERGY • TWH / YEAR</text><text x="120" y="395" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0">Observed, 2025</text><text x="120" y="448" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="31" font-weight="750" text-anchor="start" letter-spacing="0">116 TWh</text><text x="400" y="448" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="550" text-anchor="start" letter-spacing="0">total electricity</text><rect x="120" y="492" width="570" height="38" rx="12" fill="#EAF1F4" stroke="none" stroke-width="1"/><rect x="120" y="492" width="20" height="38" rx="12" fill="#4CD964" stroke="none" stroke-width="1"/><text x="120" y="565" fill="#4CD964" font-family="Inter,Manrope,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">4 TWh mobility</text><text x="120" y="598" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0">3.5% of 2025 total</text><text x="120" y="665" fill="#00B4A6" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="650" text-anchor="start" letter-spacing="0">2050 studied mobility / total scenario: 51.8 / 505 TWh ≈ 10.3%</text><rect x="810" y="290" width="710" height="430" rx="22" fill="#FFFFFF" stroke="#D6E1E6" stroke-width="1"/><rect x="836" y="314" width="220" height="38" rx="19" fill="#EAF1F4" stroke="none" stroke-width="1"/><text x="946.0" y="339" fill="#4CD964" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">FLEXIBLE POWER • GW</text><text x="850" y="395" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0">Modelled potential by 2050</text><text x="850" y="480" fill="#4CD964" font-family="Inter,Manrope,Arial,sans-serif" font-size="43" font-weight="750" text-anchor="start" letter-spacing="0">6.7 GW</text><text x="1085" y="478" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="550" text-anchor="start" letter-spacing="0">shiftable EV charging</text><line x1="850" y1="520" x2="1475" y2="520" stroke="#D6E1E6" stroke-width="2" stroke-linecap="round"/><text x="850" y="585" fill="#00B4A6" font-family="Inter,Manrope,Arial,sans-serif" font-size="31" font-weight="750" text-anchor="start" letter-spacing="0">11.2 GW</text><text x="1050" y="582" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" letter-spacing="0">theoretical with bidirectional home charging</text><text x="850" y="635" fill="#D9932E" font-family="Inter,Manrope,Arial,sans-serif" font-size="16" font-weight="650" text-anchor="start" letter-spacing="0">Scenario potential—not contracted capacity.</text><rect x="80" y="775" width="1440" height="54" rx="15" fill="#041D30" stroke="none" stroke-width="1"/><text x="110" y="810" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" letter-spacing="0">Use annual energy for scale; use local load profiles for site decisions.</text></svg>