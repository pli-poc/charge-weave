</style><rect width="1600" height="900" fill="#F7FAFB"/><rect x="80" y="42" width="250" height="38" rx="19" fill="#EAF1F4" stroke="none" stroke-width="1"/><text x="205.0" y="67" fill="#00B4A6" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">EMS STRATEGIES</text><text x="80" y="134.0" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="42" font-weight="750" text-anchor="start" letter-spacing="0">Six charging strategies answer different questions</text><text x="80" y="181" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="21" font-weight="450" text-anchor="start" letter-spacing="0">The best schedule is feasible, explainable and aligned with the service promise.</text><line x1="80" y1="232" x2="1520" y2="232" stroke="#D6E1E6" stroke-width="2" stroke-linecap="round"/><text x="80" y="858" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="450" text-anchor="start" letter-spacing="0">Strategy concepts from Sjef van Leeuwen • 23 September 2026</text><text x="1520" y="858" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="end" letter-spacing="1">CHARGEWEAVE INSIGHT • DRAFT</text><circle cx="800" cy="460" r="88" fill="#062D49" stroke="none" stroke-width="1"/><text x="800" y="452" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">FEASIBLE</text><text x="800" y="484" fill="#4CD964" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">SCHEDULE</text><line x1="800" y1="460" x2="260" y2="310" stroke="#062D49" stroke-width="3" stroke-linecap="round"/><line x1="800" y1="460" x2="800" y2="275" stroke="#00B4A6" stroke-width="3" stroke-linecap="round"/><line x1="800" y1="460" x2="1340" y2="310" stroke="#4CD964" stroke-width="3" stroke-linecap="round"/><line x1="800" y1="460" x2="260" y2="610" stroke="#00B4A6" stroke-width="3" stroke-linecap="round"/><line x1="800" y1="460" x2="800" y2="655" stroke="#4CD964" stroke-width="3" stroke-linecap="round"/><line x1="800" y1="460" x2="1340" y2="610" stroke="#062D49" stroke-width="3" stroke-linecap="round"/><circle cx="260" cy="310" r="35" fill="#062D49" stroke="none" stroke-width="1"/><text x="260" y="316" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="16" font-weight="750" text-anchor="middle" letter-spacing="0">01</text><text x="260" y="370" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">Immediate</text><text x="260" y="398" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0">How soon is energy needed?</text><circle cx="800" cy="275" r="35" fill="#00B4A6" stroke="none" stroke-width="1"/><text x="800" y="281" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="16" font-weight="750" text-anchor="middle" letter-spacing="0">02</text><text x="800" y="335" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">Load balancing</text><text x="800" y="363" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0">How is capacity shared?</text><circle cx="1340" cy="310" r="35" fill="#4CD964" stroke="none" stroke-width="1"/><text x="1340" y="316" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="16" font-weight="750" text-anchor="middle" letter-spacing="0">03</text><text x="1340" y="370" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">Deadline-aware</text><text x="1340" y="398" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0">What must be ready by departure?</text><circle cx="260" cy="610" r="35" fill="#00B4A6" stroke="none" stroke-width="1"/><text x="260" y="616" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="16" font-weight="750" text-anchor="middle" letter-spacing="0">04</text><text x="260" y="670" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">Cheapest-price</text><text x="260" y="698" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0">When is energy price lowest?</text><circle cx="800" cy="655" r="35" fill="#4CD964" stroke="none" stroke-width="1"/><text x="800" y="661" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="16" font-weight="750" text-anchor="middle" letter-spacing="0">05</text><text x="800" y="715" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">Peak-aware</text><text x="800" y="743" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0">How do we limit peak demand?</text><circle cx="1340" cy="610" r="35" fill="#062D49" stroke="none" stroke-width="1"/><text x="1340" y="616" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="16" font-weight="750" text-anchor="middle" letter-spacing="0">06</text><text x="1340" y="670" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">Total-cost-aware</text><text x="1340" y="698" fill="#607785" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0">What is the full cost trade-off?</text><rect x="335" y="735" width="930" height="38" rx="11" fill="#EAF1F4" stroke="none" stroke-width="1"/><text x="800" y="760" fill="#00B4A6" font-family="Inter,Manrope,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0">Hard limits and authorized priorities bound every strategy.</text><rect x="80" y="775" width="1440" height="54" rx="15" fill="#041D30" stroke="none" stroke-width="1"/><text x="110" y="810" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" letter-spacing="0">Price is one input; service intent, site capacity and total cost matter too.</text></svg>