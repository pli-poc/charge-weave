ope,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="0">Measure use</text><circle cx="665" cy="548" r="8" fill="#D9932E" stroke="none" stroke-width="1"/><text x="665" y="580" fill="#D9932E" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">capacity / agreement</text><circle cx="925" cy="548" r="8" fill="#D9932E" stroke="none" stroke-width="1"/><text x="925" y="580" fill="#D9932E" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">permits / delivery</text><circle cx="1185" cy="548" r="8" fill="#D9932E" stroke="none" stroke-width="1"/><text x="1185" y="580" fill="#D9932E" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">commissioning / integration</text><rect x="170" y="640" width="1260" height="62" rx="14" fill="#EAF1F4" stroke="none" stroke-width="1"/><text x="800" y="680" fill="#062D49" font-family="Inter,Manrope,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" letter-spacing="0">Record the time, owner and unresolved dependency at every stage.</text><rect x="80" y="775" width="1440" height="54" rx="15" fill="#041D30" stroke="none" stroke-width="1"/><text x="110" y="810" fill="#FFFFFF" font-family="Inter,Manrope,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" letter-spacing="0">A national rollout rate cannot replace a location-level delivery plan.</text></svg>