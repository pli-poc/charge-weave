name: Focused modelling matrix

# Diagnostic feedback alongside existing required verification. These jobs do not
# replace the ontology, authoring or protected website release gates.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelling-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Model / ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: generated consistency
            command: python tools/check_generated.py
          - gate: business rules
            command: python tools/test_business.py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: ${{ matrix.command }}

  backend:
    name: MCP and workspace / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: ontology-authoring/package-lock.json
      - run: npm ci
        working-directory: ontology-authoring
      - name: Workspace, MCP, HTTP and pairing contracts
        run: node --test test/workspace.test.js test/mcp.test.js test/http.test.js test/pairing.test.js
        working-directory: ontology-authoring

  browser:
    name: Modelling smoke / ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: |
            ontology-authoring/package-lock.json
            client-runtime/package-lock.json
            website/package-lock.json
      - run: npm ci --prefix ontology-authoring
      - run: npm ci --prefix client-runtime
      - run: npm ci --prefix website
      - run: npm run build --prefix website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - name: Run representative modelling journeys
        run: npx playwright test tests/studio-first-time-journey.spec.js tests/modelling.spec.js --project=${{ matrix.project }} -g 'first-time modeller|inherited fields|mobile relationship list|browser discovers and edits the shared MCP workspace'
        working-directory: website
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modelling-smoke-${{ matrix.project }}
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: warn
          retention-days: 14
