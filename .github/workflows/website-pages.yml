name: Website / Public App Deployment

on:
  push:
    branches: [main]
    paths:
      [
        "website/**",
        "console-app/**",
        "content/blog/**",
        "model/**",
        "ontology/**",
        "validation/**",
        "queries/**",
        "xflow/**",
        ".github/workflows/website-pages.yml",
      ]
  pull_request:
    paths:
      [
        "website/**",
        "console-app/**",
        "content/blog/**",
        "model/**",
        "ontology/**",
        "validation/**",
        "queries/**",
        "xflow/**",
        ".github/workflows/website-pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify changed files
    runs-on: ubuntu-24.04
    outputs:
      article_only: ${{ steps.scope.outputs.article_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        name: Identify article-only changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          article_only=false
          if [[ "$EVENT_NAME" != "workflow_dispatch" && -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            if [[ -n "$changed_files" ]] && ! printf '%s\n' "$changed_files" | grep -qv '^content/blog/'; then
              article_only=true
            fi
          fi
          echo "article_only=$article_only" >> "$GITHUB_OUTPUT"
          echo "Article-only path: $article_only"

  build:
    name: Build and browser checks
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            console-app/package-lock.json
      - run: npm ci --prefix ../console-app
      - run: npm ci
      - name: Install pinned production obfuscator
        run: npm install --no-save --package-lock=false javascript-obfuscator@5.8.0
      - name: Validate published articles and image references
        run: npm run check:blog
      - name: Test the console application
        if: needs.scope.outputs.article_only != 'true'
        run: npm run test --prefix ../console-app
      - run: npm run build --prefix ../console-app
      - run: npm run build
      - run: mkdir -p dist/app && cp -R ../console-app/dist/. dist/app/
      - name: Verify public build has no source-repository links
        run: npm run check:public-links
      - name: Protect assembled production JavaScript
        run: npm run protect:build
      - name: Verify protected deploy artifact
        run: npm run check:protection
      - name: Verify generated article pages and images
        run: node scripts/check-blog-content.mjs --built
      - name: Install browser for full application checks
        if: needs.scope.outputs.article_only != 'true'
        run: npx playwright install --with-deps chromium
      - name: Run application and browser checks
        if: needs.scope.outputs.article_only != 'true'
        run: npm test
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-report
          path: |
            website/playwright-report
            website/test-results
            website/.production-protection-report.json
          retention-days: 14
      - name: Upload protected public-site artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: charge-weave-public-site
          path: website/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish protected build to charge-weave-app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download protected public-site artifact
        uses: actions/download-artifact@v4
        with:
          name: charge-weave-public-site
          path: public-site

      - name: Publish generated files to public repository
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.CHARGE_WEAVE_APP_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$DEPLOY_TOKEN" ]]; then
            echo "Missing repository secret CHARGE_WEAVE_APP_TOKEN"
            exit 1
          fi

          cd public-site
          touch .nojekyll
          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ChargeWeave ${SOURCE_SHA:0:12}"
          git remote add origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/pli-poc/charge-weave-app.git"
          git push --force origin main

      - name: Configure and publish GitHub Pages
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.CHARGE_WEAVE_APP_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_TOKEN" ]]; then
            echo "Missing repository secret CHARGE_WEAVE_APP_TOKEN"
            exit 1
          fi

          api="https://api.github.com/repos/pli-poc/charge-weave-app/pages"
          accept="Accept: application/vnd.github+json"
          auth="Authorization: Bearer $DEPLOY_TOKEN"
          version="X-GitHub-Api-Version: 2026-03-10"
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'

          current_status=$(curl -sS -o /tmp/pages-current.json -w "%{http_code}" \
            -H "$accept" -H "$auth" -H "$version" "$api")

          if [[ "$current_status" == "404" ]]; then
            echo "GitHub Pages is not enabled yet; creating the site."
            configure_status=$(curl -sS -o /tmp/pages-configure.json -w "%{http_code}" \
              -X POST -H "$accept" -H "$auth" -H "$version" \
              "$api" -d "$payload")
            if [[ "$configure_status" != "201" ]]; then
              echo "Failed to create GitHub Pages (HTTP $configure_status):"
              cat /tmp/pages-configure.json
              exit 1
            fi
          elif [[ "$current_status" == "200" ]]; then
            echo "GitHub Pages exists; enforcing main:/ branch publishing."
            configure_status=$(curl -sS -o /tmp/pages-configure.json -w "%{http_code}" \
              -X PUT -H "$accept" -H "$auth" -H "$version" \
              "$api" -d "$payload")
            if [[ "$configure_status" != "204" ]]; then
              echo "Failed to update GitHub Pages (HTTP $configure_status):"
              cat /tmp/pages-configure.json
              exit 1
            fi
          else
            echo "Could not inspect GitHub Pages (HTTP $current_status):"
            cat /tmp/pages-current.json
            exit 1
          fi

          echo "Requesting a Pages build for the protected main-branch artifact."
          build_status=$(curl -sS -o /tmp/pages-build.json -w "%{http_code}" \
            -X POST -H "$accept" -H "$auth" -H "$version" "$api/builds")

          if [[ "$build_status" != "201" && "$build_status" != "409" ]]; then
            echo "Failed to request GitHub Pages build (HTTP $build_status):"
            cat /tmp/pages-build.json
            exit 1
          fi

          for attempt in {1..30}; do
            sleep 5
            latest_status=$(curl -sS -o /tmp/pages-latest.json -w "%{http_code}" \
              -H "$accept" -H "$auth" -H "$version" "$api/builds/latest")
            if [[ "$latest_status" != "200" ]]; then
              echo "Could not read latest Pages build (HTTP $latest_status):"
              cat /tmp/pages-latest.json
              exit 1
            fi

            state=$(jq -r '.status // "unknown"' /tmp/pages-latest.json)
            echo "Pages build state: $state (attempt $attempt/30)"

            if [[ "$state" == "built" ]]; then
              echo "GitHub Pages published: https://pli-poc.github.io/charge-weave-app/"
              exit 0
            fi

            if [[ "$state" == "errored" ]]; then
              cat /tmp/pages-latest.json
              exit 1
            fi
          done

          echo "Timed out waiting for GitHub Pages to finish publishing."
          cat /tmp/pages-latest.json
          exit 1
