name: Website / GitHub Pages

on:
  push:
    branches: [main]
    paths:
      [
        "website/**",
        "console-app/**",
        "model/**",
        "ontology/**",
        "validation/**",
        "queries/**",
        ".github/workflows/website-pages.yml",
      ]
  pull_request:
    paths:
      [
        "website/**",
        "console-app/**",
        "model/**",
        "ontology/**",
        "validation/**",
        "queries/**",
        ".github/workflows/website-pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            console-app/package-lock.json
      - run: npm ci --prefix ../console-app
      - run: npm ci
      - run: npm run test --prefix ../console-app
      - run: npm run build --prefix ../console-app
      - run: npm run build
      - run: mkdir -p dist/app && cp -R ../console-app/dist/. dist/app/
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-report
          path: |
            website/playwright-report
            website/test-results
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@v4
