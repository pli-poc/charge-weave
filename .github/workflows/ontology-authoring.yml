name: Ontology authoring

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interval-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: ontology-authoring/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: npm ci --prefix ontology-authoring
      - run: python -m pip install -r requirements.txt
      - run: node --test --test-name-pattern='real interval candidate' test/interval-workspace.test.js
        working-directory: ontology-authoring
        env:
          CHARGEWEAVE_TEST_PYTHON: python
          CHARGEWEAVE_TEST_RULE_TEMPLATE: '1'
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: ontology-authoring/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: npm ci --prefix ontology-authoring
      - run: python -m pip install -r requirements.txt
      - run: java -version
      - run: python tools/check_owl.py
      - run: node --test test/workspace.test.js test/mcp.test.js
        working-directory: ontology-authoring
  authoring_suite:
    name: Authoring suite / remaining checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: ontology-authoring/package-lock.json
      - run: npm ci
        working-directory: ontology-authoring
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python tools/test_domain_schema.py
      - run: python tools/test_authoring_adapter.py
      - run: python tools/test_authoring_example_overrides.py
      - run: python tools/test_business_case_provenance.py
      - run: python tools/test_check_generated.py
      - run: npm test -- --test-skip-pattern='^reference profile (runs generated model and fixture checks|generates evidence from requirement and temporal overlays)$'
        working-directory: ontology-authoring
        env:
          CHARGEWEAVE_TEST_PYTHON: python
          CHARGEWEAVE_TEST_REFERENCE: '1'
          CHARGEWEAVE_TEST_MAINTENANCE: '1'
  reference:
    name: Authoring suite / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: reference fixtures
            test_name: reference profile runs generated model and fixture checks
          - check: reference overlays
            test_name: reference profile generates evidence from requirement and temporal overlays
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: ontology-authoring/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: npm ci --prefix ontology-authoring
      - run: python -m pip install -r requirements.txt
      - name: Run exactly one reference scenario
        working-directory: ontology-authoring
        env:
          CHARGEWEAVE_TEST_PYTHON: python
          CHARGEWEAVE_TEST_REFERENCE: '1'
          TEST_NAME: ${{ matrix.test_name }}
        run: |
          set -o pipefail
          node --test --test-name-pattern="^${TEST_NAME}$" test/validation.test.js | tee reference-result.tap
          grep -qx '# pass 1' reference-result.tap
  test:
    name: test
    needs: [authoring_suite, reference]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require all authoring suite jobs
        env:
          SUITE_RESULT: ${{ needs.authoring_suite.result }}
          REFERENCE_RESULT: ${{ needs.reference.result }}
        run: |
          if [[ "$SUITE_RESULT" != success || "$REFERENCE_RESULT" != success ]]; then
            echo "Authoring suite: $SUITE_RESULT; reference matrix: $REFERENCE_RESULT"
            exit 1
          fi
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: |
            ontology-authoring/package-lock.json
            client-runtime/package-lock.json
            website/package-lock.json
      - run: npm ci --prefix ontology-authoring
      - run: npm ci --prefix client-runtime
      - run: npm ci --prefix website
      - run: npm run build --prefix website
      - run: node --test src/model/event-cursor.test.js src/model/canvas-pins.test.js src/model/canvas-history.test.js src/model/canvas-viewport.test.js src/model/canvas-hidden.test.js src/model/canvas-groups.test.js src/model/canvas-distribute.test.js src/model/canvas-redo.test.js src/model/context-checks.test.js
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - run: npx playwright test tests/modelling.spec.js --project=desktop
        working-directory: website
      - run: npx playwright test tests/canvas-relationship-focus.spec.js tests/canvas-layout-dismiss.spec.js tests/studio-canvas-inspector.spec.js tests/studio-diagram-controls-theme.spec.js tests/canvas-layout.spec.js tests/canvas-relationship.spec.js tests/canvas-alignment.spec.js tests/canvas-pins.spec.js tests/canvas-undo.spec.js tests/canvas-zoom.spec.js tests/canvas-viewport.spec.js tests/canvas-hidden.spec.js tests/canvas-groups.spec.js tests/canvas-distribution.spec.js tests/canvas-redo.spec.js tests/canvas-endpoints.spec.js tests/canvas-pan.spec.js tests/canvas-minimap.spec.js tests/canvas-minimap-navigation.spec.js tests/canvas-selection-shortcuts.spec.js tests/canvas-focus-selection.spec.js tests/canvas-line-styles.spec.js tests/canvas-card-badges.spec.js tests/studio-card-readability.spec.js tests/studio-allowed-values.spec.js tests/studio-allowed-values-review.spec.js tests/studio-controlled-values.spec.js tests/studio-controlled-values-focus.spec.js tests/studio-controlled-values-start-focus.spec.js tests/studio-controlled-values-error-accessibility.spec.js tests/studio-field-search.spec.js tests/studio-create-workspace-responsive.spec.js tests/studio-scale-explorer.spec.js tests/studio-changed-explorer.spec.js tests/studio-parent-explorer.spec.js tests/studio-source-preview.spec.js tests/canvas-edit-relationship.spec.js tests/studio-context-copy-race.spec.js tests/studio-incomplete-check.spec.js tests/studio-initial-view.spec.js tests/studio-view-selection-race.spec.js tests/studio-view-note-draft.spec.js tests/studio-interval-draft.spec.js tests/studio-relationship-review.spec.js tests/studio-results-panel-position.spec.js tests/studio-concept-draft.spec.js tests/studio-responsibility-filter-accessibility.spec.js tests/studio-responsibility-draft.spec.js tests/studio-required-relationship.spec.js tests/studio-field-draft.spec.js tests/studio-field-conflict.spec.js tests/studio-definition-draft.spec.js tests/studio-results-responsive.spec.js tests/studio-repeated-checks.spec.js tests/studio-results-scroll.spec.js tests/studio-scrollable-output.spec.js tests/studio-offline-checks.spec.js tests/studio-form-groups.spec.js tests/studio-toggle-layout.spec.js tests/studio-theme.spec.js tests/studio-density.spec.js tests/studio-theme-accessibility.spec.js tests/studio-keyboard-contrast.spec.js --project=desktop
        working-directory: website
      - run: npx playwright test tests/modelling.spec.js --project=mobile -g "mobile relationship list"
        working-directory: website
      - run: npx playwright test tests/canvas-layout-dismiss.spec.js tests/canvas-touch-zoom.spec.js tests/studio-zoom-reflow.spec.js tests/studio-theme-accessibility.spec.js tests/studio-theme.spec.js tests/studio-card-readability.spec.js tests/studio-density.spec.js tests/studio-touch-targets.spec.js tests/studio-allowed-values.spec.js tests/studio-allowed-values-review.spec.js tests/studio-controlled-values.spec.js tests/studio-controlled-values-focus.spec.js tests/studio-controlled-values-start-focus.spec.js tests/studio-controlled-values-error-accessibility.spec.js tests/studio-field-search.spec.js tests/studio-create-workspace-responsive.spec.js tests/studio-scale-explorer.spec.js tests/studio-changed-explorer.spec.js tests/studio-parent-explorer.spec.js tests/studio-source-preview.spec.js tests/canvas-edit-relationship.spec.js tests/studio-context-copy-race.spec.js tests/studio-incomplete-check.spec.js tests/studio-initial-view.spec.js tests/studio-view-selection-race.spec.js tests/studio-view-note-draft.spec.js tests/studio-interval-draft.spec.js tests/studio-relationship-review.spec.js tests/studio-results-panel-position.spec.js tests/studio-concept-draft.spec.js tests/studio-responsibility-filter-accessibility.spec.js tests/studio-responsibility-draft.spec.js tests/studio-required-relationship.spec.js tests/studio-field-draft.spec.js tests/studio-field-conflict.spec.js tests/studio-definition-draft.spec.js tests/studio-results-responsive.spec.js tests/studio-repeated-checks.spec.js tests/studio-results-scroll.spec.js tests/studio-scrollable-output.spec.js tests/studio-offline-checks.spec.js tests/studio-form-groups.spec.js tests/studio-toggle-layout.spec.js tests/canvas-card-badges.spec.js tests/canvas-hidden.spec.js tests/canvas-groups.spec.js tests/canvas-distribution.spec.js tests/canvas-redo.spec.js tests/canvas-endpoints.spec.js tests/canvas-pan.spec.js tests/canvas-minimap.spec.js tests/canvas-minimap-navigation.spec.js tests/canvas-selection-shortcuts.spec.js tests/canvas-focus-selection.spec.js tests/canvas-line-styles.spec.js --project=mobile
        working-directory: website
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authoring-browser-failure
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
          retention-days: 7
