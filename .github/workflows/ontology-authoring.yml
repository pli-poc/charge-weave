name: Ontology authoring

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - run: npm ci
        working-directory: ontology-authoring
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm test
        working-directory: ontology-authoring
        env:
          CHARGEWEAVE_TEST_PYTHON: python
          CHARGEWEAVE_TEST_REFERENCE: '1'
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - run: npm ci --prefix ontology-authoring
      - run: npm ci --prefix client-runtime
      - run: npm ci --prefix website
      - run: npm run build --prefix website
      - run: node --test src/model/event-cursor.test.js
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - run: npx playwright test tests/modelling.spec.js --project=desktop
        working-directory: website
