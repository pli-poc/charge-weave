<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080f16" />
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <script>
      (() => {
        const removeInjectedDarkMode = (root = document) => {
          root.querySelectorAll?.(
            "style.darkreader, link.darkreader, meta.darkreader, [data-darkreader-inline-bgcolor], [data-darkreader-inline-color]"
          ).forEach((node) => {
            if (node.matches?.("style.darkreader, link.darkreader, meta.darkreader")) {
              node.remove();
              return;
            }
            node.removeAttribute?.("data-darkreader-inline-bgcolor");
            node.removeAttribute?.("data-darkreader-inline-color");
            node.removeAttribute?.("data-darkreader-inline-border");
            node.removeAttribute?.("data-darkreader-inline-fill");
            node.removeAttribute?.("data-darkreader-inline-stroke");
          });
        };

        removeInjectedDarkMode();

        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (!(node instanceof Element)) continue;
              if (
                node.matches(
                  "style.darkreader, link.darkreader, meta.darkreader"
                )
              ) {
                node.remove();
                continue;
              }
              removeInjectedDarkMode(node);
            }
          }
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      })();
    </script>
    <meta
      name="description"
      content="ChargeWeave is building a connected foundation for charging operations, energy and commercial flows. Explore the planned capabilities and open development roadmap."
    />
    <meta
      property="og:title"
      content="ChargeWeave — Connect the whole charging business"
    />
    <meta
      property="og:description"
      content="Charging operations, energy and commercial flows. One connected foundation, in development."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pli-poc.github.io/charge-weave-app/" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>ChargeWeave — Connect the whole charging business</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
